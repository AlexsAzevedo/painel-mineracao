name: Publicar versão

# Toda vez que a versão em desktop/package.json muda no main, o GitHub monta o instalador do Windows e o app do
# celular (Android) e publica a release com o instalador, o .blockmap, o latest.yml, o Painel-de-Mineracao.apk e o
# pacote da página do app (painel-celular.zip e painel-celular.json, o manifesto assinado com a chave do .apk), usando
# o texto de notas/vX.Y.Z.md. Os painéis instalados encontram a versão nova sozinhos; o app do celular (1.8.0 ou mais
# novo) baixa a página nova sozinho e, quando a parte Android muda, o .apk novo.
# O app do celular tem a versão dele (celular/package.json), que só sobe quando a parte Android muda (o passo
# "Conferir a parte Android do app" garante): ela vai no rótulo do .apk ("Painel-de-Mineracao.apk (app X.Y.Z)").
# O .apk só sai com a chave de assinatura nos segredos do repositório (ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA).
# Se a versão já tem release, só confere se falta o .apk (segredos postos depois): aí monta e acrescenta o .apk.
on:
  push:
    branches: [main]
    paths: ["desktop/package.json", "celular/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    # fixo no Ubuntu 24.04: o app do celular usa o Android SDK que vem nessa imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_SENHA != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir a versão
        id: v
        run: |
          versao=$(jq -r .version desktop/package.json)
          app=$(jq -r .version celular/package.json)
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$app" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A versão do app do celular (celular/package.json) não é do tipo X.Y.Z: $app"
            exit 1
          fi
          if gh release view "v$versao" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            if [ "$TEM_CHAVE" = "sim" ] && ! gh release view "v$versao" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "Painel-de-Mineracao.apk"; then
              echo "A versão $versao já está publicada, sem o app do celular: vou montar o .apk e acrescentar."
              echo "apk=sim" >> "$GITHUB_OUTPUT"
            else
              echo "A versão $versao já está publicada. Nada a fazer."
              echo "apk=nao" >> "$GITHUB_OUTPUT"
            fi
          elif [ ! -f "notas/v$versao.md" ]; then
            echo "::error::Falta o arquivo notas/v$versao.md com as novidades da versão $versao."
            exit 1
          else
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
            echo "apk=$TEM_CHAVE" >> "$GITHUB_OUTPUT"
            if [ "$TEM_CHAVE" != "sim" ]; then
              echo "::warning::Sem a chave de assinatura nos segredos (ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA): a versão sai sem o app do celular."
            fi
          fi

      - name: Conferir a parte Android do app
        if: steps.v.outputs.apk == 'sim'
        run: python3 celular/scripts/conferir-nativo.py

      - uses: actions/setup-node@v5
        if: steps.v.outputs.publicar == 'sim' || steps.v.outputs.apk == 'sim'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            celular/package-lock.json

      - name: Instalar as dependências
        if: steps.v.outputs.publicar == 'sim'
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Montar a página do aplicativo (sem dados pessoais)
        if: steps.v.outputs.publicar == 'sim'
        working-directory: desktop
        run: python3 scripts/gerar-index.py ../mineracao.html

      - name: Gerar o instalador do Windows
        if: steps.v.outputs.publicar == 'sim'
        working-directory: desktop
        run: node scripts/build-win.js

      - uses: actions/setup-java@v5
        if: steps.v.outputs.apk == 'sim'
        with:
          distribution: temurin
          java-version: 21

      - name: Gerar o app do celular (Android)
        if: steps.v.outputs.apk == 'sim'
        working-directory: celular
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PAINEL_KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          npm ci
          python3 scripts/montar-www.py
          npx cap sync android
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/painel.jks"
          export PAINEL_KEYSTORE="$RUNNER_TEMP/painel.jks"
          (cd android && ./gradlew --no-daemon assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Painel-de-Mineracao.apk"
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Painel-de-Mineracao.apk"
          # o pacote da página (a mesma que vai dentro do .apk) e o manifesto assinado com a mesma chave
          python3 scripts/montar-pacote.py --www www --apk "$GITHUB_WORKSPACE/Painel-de-Mineracao.apk" --saida "$RUNNER_TEMP/pacote"
          java scripts/AssinarPainel.java "$RUNNER_TEMP/painel.jks" "$RUNNER_TEMP/pacote/manifesto.json" "$GITHUB_WORKSPACE/painel-celular.json"
          cp "$RUNNER_TEMP/pacote/painel-celular.zip" "$GITHUB_WORKSPACE/painel-celular.zip"
          rm -f "$RUNNER_TEMP/painel.jks"

      - name: Publicar a release
        if: steps.v.outputs.publicar == 'sim'
        env:
          V: ${{ steps.v.outputs.versao }}
          APP: ${{ steps.v.outputs.app }}
        run: |
          arquivos=("desktop/dist/Painel-de-Mineracao-Setup-$V.exe" "desktop/dist/Painel-de-Mineracao-Setup-$V.exe.blockmap" "desktop/dist/latest.yml")
          if [ -f Painel-de-Mineracao.apk ]; then arquivos+=("Painel-de-Mineracao.apk#Painel-de-Mineracao.apk (app $APP)"); fi
          if [ -f painel-celular.zip ] && [ -f painel-celular.json ]; then arquivos+=("painel-celular.zip" "painel-celular.json"); fi
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Versão $V" --notes-file "notas/v$V.md" "${arquivos[@]}"

      - name: Acrescentar o app do celular à release
        if: steps.v.outputs.publicar == 'nao' && steps.v.outputs.apk == 'sim'
        env:
          V: ${{ steps.v.outputs.versao }}
          APP: ${{ steps.v.outputs.app }}
        run: gh release upload "v$V" --repo "$GITHUB_REPOSITORY" "Painel-de-Mineracao.apk#Painel-de-Mineracao.apk (app $APP)" painel-celular.zip painel-celular.json
